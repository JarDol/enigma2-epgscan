name: Wydania EPG Scan i epgpl

# Nowa wersja na main (VERSION w epgscan/EPGScan/common.py albo epgpl/VERSION) = nowe wydanie.
# Gdy wydanie o tej wersji juz istnieje - nic sie nie dzieje (zmiany dokumentacji nie nadpisuja paczek).
# Wersja z sufiksem prerelease (np. -beta.1) nie jest oznaczana jako najnowsza stabilna.
# Z tych wydan aktualizuja sie wtyczka (Ustawienia -> Aktualizacja) i serwer (update.sh / epgpl-update.timer).

on:
  push:
    branches: [ main ]
    paths: [ 'epgscan/**', 'epgpl/**', '.github/workflows/release.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Notatki z opisu zmiany
        run: git log -1 --pretty=%B | perl -pe 's/\\n/\n/g' | grep -iv -E '^(Co-authored-by|Claude-Session):' > notes.md || true

      - name: EPG Scan (zip + ipk)
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' epgscan/EPGScan/common.py | head -1)
          T="epgscan-$V"
          if gh release view "$T" >/dev/null 2>&1; then echo "$T juz jest"; exit 0; fi
          sh epgscan/build.sh
          if [[ "$V" == *-* ]]; then
            FLAGS=(--prerelease --latest=false)
          else
            FLAGS=(--latest)
          fi
          gh release create "$T" "dist/epgscan-$V.zip" "dist/enigma2-plugin-extensions-epgscan_${V}_all.ipk" \
            --title "EPG Scan $V" --notes-file notes.md --target "$GITHUB_SHA" "${FLAGS[@]}"

      - name: epgpl (zip)
        run: |
          V=$(cat epgpl/VERSION)
          T="epgpl-$V"
          if gh release view "$T" >/dev/null 2>&1; then echo "$T juz jest"; exit 0; fi
          mkdir -p dist
          find epgpl -name __pycache__ -prune -exec rm -rf {} +
          zip -qr "dist/epgpl-$V.zip" epgpl
          gh release create "$T" "dist/epgpl-$V.zip" --title "epgpl $V" --notes-file notes.md --target "$GITHUB_SHA" --latest=false

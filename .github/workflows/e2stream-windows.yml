name: E2Stream Windows — wersja testowa

on:
  push:
    branches: [ 'windows/0.1.0-test' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Sprawdzenie WiX 3
        shell: pwsh
        run: |
          $wixBin = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (Test-Path "$wixBin\candle.exe") { $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Testy i instalator
        shell: pwsh
        run: |
          .\e2stream\gradlew.bat -p e2stream\desktop --no-daemon test packageReleaseExe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publikacja wersji testowej
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem e2stream/desktop/build/compose/binaries/main-release/exe/*.exe
          if (@($exe).Count -ne 1) { throw "Oczekiwano jednego instalatora EXE; znaleziono $(@($exe).Count)." }
          gh release create e2stream-windows-0.1.2-test $exe.FullName `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "E2Stream Windows 0.1.2 — wersja testowa" `
            --notes "Pierwszy etap interfejsu podobnego do Androida: ciemny odtwarzacz, pasek kanału i lista kanałów z bieżącym EPG z OpenWebif. Lista otwiera się w osobnym oknie, a pasek znajduje się pod obrazem VLC. Wymaga osobno zainstalowanego VLC 3.x 64-bit. To nadal wczesna wersja: brak m.in. pełnego EPG, nagrań i prawdziwego timeshiftu." `
            --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

name: E2Stream (Android) — budowa APK

on:
  push:
    branches: [ main, beta ]
    paths: [ 'e2stream/**', '.github/workflows/e2stream.yml' ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: e2stream

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - beta_index: 1
            libvlc_version: 3.7.0
          - beta_index: 2
            libvlc_version: 3.7.7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Budowa
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease -PbetaVlcIndex=${{ matrix.beta_index }} -PlibvlcVersion=${{ matrix.libvlc_version }}

      - name: Nazwa pliku z wersją
        run: |
          V="0.18.38-beta.${{ matrix.beta_index }}-vlc.${{ matrix.libvlc_version }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/e2stream-$V.apk"
          echo "VER=$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: e2stream-${{ env.VER }}
          path: e2stream/out/*.apk

      # Wydania E2Stream są oddzielne od wydań wtyczki EPG Scan.
      - name: Wydanie e2stream-X.Y.Z
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="e2stream-$VER"
          IS_BETA=false
          if [ "$GITHUB_REF_NAME" = "beta" ]; then IS_BETA=true; fi
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md || true
          printf '\n\nlibVLC: %s\n' '${{ matrix.libvlc_version }}' >> notes.md
          if gh release view "$T" >/dev/null 2>&1; then
            echo "Wydanie $T już istnieje — nie nadpisuję go" >&2
            exit 1
          else
            if [ "$IS_BETA" = true ]; then
              gh release create "$T" out/*.apk --title "E2Stream $VER" --notes-file notes.md --target "$GITHUB_SHA" --latest=false --prerelease
            else
              gh release create "$T" out/*.apk --title "E2Stream $VER" --notes-file notes.md --target "$GITHUB_SHA" --latest=false
            fi
          fi
